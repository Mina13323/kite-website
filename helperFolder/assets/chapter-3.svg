<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="50%" stop-color="#6a0572"/>
      <stop offset="100%" stop-color="#2d0845"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg3)"/>
  <!-- Memphis style shapes -->
  <!-- Large circle -->
  <circle cx="200" cy="120" r="55" fill="none" stroke="#ff6b9d" stroke-width="3" opacity="0.6"/>
  <!-- Triangle -->
  <polygon points="70,280 130,180 190,280" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.5"/>
  <!-- Squiggle lines -->
  <path d="M 40,100 Q 55,80 70,100 Q 85,120 100,100 Q 115,80 130,100" fill="none" stroke="#ffde59" stroke-width="2" opacity="0.5"/>
  <path d="M 180,320 Q 195,300 210,320 Q 225,340 240,320 Q 255,300 270,320" fill="none" stroke="#ff6b9d" stroke-width="2" opacity="0.4"/>
  <!-- Dots pattern -->
  <circle cx="50" cy="180" r="5" fill="#ffde59" opacity="0.5"/>
  <circle cx="70" cy="160" r="3" fill="#00d4ff" opacity="0.4"/>
  <circle cx="250" cy="240" r="6" fill="#ff6b9d" opacity="0.4"/>
  <circle cx="230" cy="260" r="3" fill="#ffde59" opacity="0.5"/>
  <circle cx="80" cy="340" r="4" fill="#00d4ff" opacity="0.4"/>
  <!-- Cross shapes -->
  <g transform="translate(240,80)" opacity="0.4">
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#ffde59" stroke-width="2"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#ffde59" stroke-width="2"/>
  </g>
  <g transform="translate(60,60)" opacity="0.3">
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#00d4ff" stroke-width="2"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#00d4ff" stroke-width="2"/>
  </g>
  <!-- Filled accent shapes -->
  <rect x="210" y="190" width="30" height="30" rx="0" fill="#ffde59" opacity="0.25" transform="rotate(15, 225, 205)"/>
  <circle cx="150" cy="200" r="20" fill="#ff6b9d" opacity="0.2"/>
  <!-- Zigzag -->
  <polyline points="30,380 50,360 70,380 90,360 110,380 130,360 150,380 170,360 190,380 210,360 230,380 250,360 270,380" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.25"/>
  <!-- Era text -->
  <text x="150" y="30" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#ffde59" opacity="0.5" letter-spacing="4">RADICAL</text>
</svg>
