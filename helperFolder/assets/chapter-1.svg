<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2b1f"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#7a5c1f"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg1)"/>
  <!-- Ornate frame -->
  <rect x="24" y="24" width="252" height="352" rx="2" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.5"/>
  <rect x="32" y="32" width="236" height="336" rx="2" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.3"/>
  <!-- Classical column shapes -->
  <rect x="60" y="120" width="12" height="180" fill="url(#gold1)" opacity="0.35"/>
  <rect x="228" y="120" width="12" height="180" fill="url(#gold1)" opacity="0.35"/>
  <rect x="52" y="112" width="28" height="10" rx="2" fill="#c9a84c" opacity="0.3"/>
  <rect x="220" y="112" width="28" height="10" rx="2" fill="#c9a84c" opacity="0.3"/>
  <rect x="52" y="298" width="28" height="10" rx="2" fill="#c9a84c" opacity="0.3"/>
  <rect x="220" y="298" width="28" height="10" rx="2" fill="#c9a84c" opacity="0.3"/>
  <!-- Central serif letter -->
  <text x="150" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="120" font-weight="bold" fill="#c9a84c" opacity="0.25">K</text>
  <!-- Decorative lines -->
  <line x1="90" y1="155" x2="210" y2="155" stroke="#c9a84c" stroke-width="0.5" opacity="0.3"/>
  <line x1="90" y1="270" x2="210" y2="270" stroke="#c9a84c" stroke-width="0.5" opacity="0.3"/>
  <!-- Small ornaments -->
  <circle cx="150" cy="155" r="4" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
  <circle cx="150" cy="270" r="4" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
  <!-- Era text -->
  <text x="150" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c9a84c" opacity="0.5" letter-spacing="3">HERITAGE</text>
</svg>
