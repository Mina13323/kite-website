<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#162d50"/>
    </linearGradient>
    <linearGradient id="glow4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="300" height="400" fill="url(#bg4)"/>
  <!-- Soft glow -->
  <circle cx="150" cy="190" r="60" fill="url(#glow4)" opacity="0.08" filter="url(#blur4)"/>
  <!-- Clean geometric rings -->
  <circle cx="150" cy="190" r="45" fill="none" stroke="#4facfe" stroke-width="0.8" opacity="0.35"/>
  <circle cx="150" cy="190" r="65" fill="none" stroke="#4facfe" stroke-width="0.5" opacity="0.2"/>
  <circle cx="150" cy="190" r="85" fill="none" stroke="#4facfe" stroke-width="0.3" opacity="0.12"/>
  <!-- Floating particles -->
  <circle cx="90" cy="120" r="2" fill="#4facfe" opacity="0.4"/>
  <circle cx="220" cy="150" r="1.5" fill="#00f2fe" opacity="0.3"/>
  <circle cx="180" cy="90" r="1" fill="#4facfe" opacity="0.5"/>
  <circle cx="70" cy="280" r="1.5" fill="#00f2fe" opacity="0.3"/>
  <circle cx="240" cy="300" r="2" fill="#4facfe" opacity="0.25"/>
  <circle cx="120" cy="310" r="1" fill="#00f2fe" opacity="0.35"/>
  <!-- Thin grid lines -->
  <line x1="150" y1="40" x2="150" y2="340" stroke="#4facfe" stroke-width="0.3" opacity="0.1"/>
  <line x1="50" y1="190" x2="250" y2="190" stroke="#4facfe" stroke-width="0.3" opacity="0.1"/>
  <!-- Central accent dot -->
  <circle cx="150" cy="190" r="4" fill="#4facfe" opacity="0.6"/>
  <circle cx="150" cy="190" r="8" fill="none" stroke="#4facfe" stroke-width="0.5" opacity="0.4"/>
  <!-- Minimal data lines -->
  <line x1="100" y1="250" x2="130" y2="230" stroke="#4facfe" stroke-width="0.5" opacity="0.2"/>
  <line x1="130" y1="230" x2="160" y2="245" stroke="#4facfe" stroke-width="0.5" opacity="0.2"/>
  <line x1="160" y1="245" x2="200" y2="220" stroke="#4facfe" stroke-width="0.5" opacity="0.2"/>
  <!-- Era text -->
  <text x="150" y="370" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#4facfe" opacity="0.4" letter-spacing="4">DIGITAL</text>
</svg>
