<div id="preloader">
  <div class="scene-bg"></div>
  <div class="cloud cloud-1"><img src="/assets/kite/preloader/cloud.svg" alt=""></div>
  <div class="cloud cloud-2"><img src="/assets/kite/preloader/cloud.svg" alt=""></div>
  <div class="cloud cloud-3"><img src="/assets/kite/preloader/cloud.svg" alt=""></div>
  <div class="cloud cloud-4"><img src="/assets/kite/preloader/cloud.svg" alt=""></div>
  <div class="cloud cloud-5"><img src="/assets/kite/preloader/cloud.svg" alt=""></div>
  <div class="cloud cloud-6"><img src="/assets/kite/preloader/cloud.svg" alt=""></div>
  <div class="ui">
    <div class="sun-wrapper">
      <span class="sun-glow"></span>
      <div class="brand-ring" aria-hidden="true"></div>
      <div class="circle">
        <img src="/assets/kite/preloader/logo-icon.svg" alt="KITE">
        <div class="counter" id="counter">0%</div>
      </div>
    </div>
  </div>
  <div class="skyline">
    <div class="house house-01"><img src="/assets/kite/preloader/house-01.svg" alt=""></div>
    <div class="house house-02"><img src="/assets/kite/preloader/house-02.svg" alt=""></div>
    <div class="house house-03"><img src="/assets/kite/preloader/house-03.svg" alt=""></div>
    <div class="house house-04"><img src="/assets/kite/preloader/house-04.svg" alt=""></div>
    <div class="house house-05"><img src="/assets/kite/preloader/house-05.svg" alt=""></div>
    <div class="house house-06"><img src="/assets/kite/preloader/house-06.svg" alt=""></div>
    <div class="house house-07"><img src="/assets/kite/preloader/house-07.svg" alt=""></div>
    <div class="house house-08"><img src="/assets/kite/preloader/house-08.svg" alt=""></div>
    <div class="house house-09"><img src="/assets/kite/preloader/house-09.svg" alt=""></div>
  </div>
  <div id="hero">
    <div class="hero-copy">
      <h1>{{heroHeadline}}</h1>
      <p>{{heroSupporting}}</p>
      <div class="hero-actions">
        <button class="btn btn-primary" type="button">{{heroCta}}</button>
        <a class="btn btn-secondary" href="{{heroSecondaryUrl}}">{{heroSecondaryCta}}</a>
      </div>
    </div>
  </div>
</div>

{{cmsHome}}
